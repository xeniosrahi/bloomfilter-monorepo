global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'bloom-sync-cluster'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'bloom-sync-node-1:8080'
          - 'bloom-sync-node-2:8080'
