apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bloomfilter.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bloomfilter.labels" . | nindent 4 }}
data:
  REDIS_HOST: "{{ include "bloomfilter.fullname" . }}-redis.{{ .Values.global.namespace }}.svc.cluster.local"
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_SSL_ENABLED: {{ .Values.redis.sslEnabled | quote }}
  BLOOM_INITIAL_CAPACITY: {{ .Values.bloom.initialCapacity | quote }}
  BLOOM_TARGET_ERROR_RATE: {{ .Values.bloom.targetErrorRate | quote }}
  BLOOM_STREAM_KEY: {{ .Values.bloom.streamKey | quote }}
  BLOOM_FILTER_KEY: {{ .Values.bloom.filterKey | quote }}
  BLOOM_CONSUMER_GROUP: {{ .Values.bloom.consumerGroup | quote }}
  BLOOM_STREAM_MAX_ENTRIES: {{ .Values.bloom.streamMaxEntries | quote }}
