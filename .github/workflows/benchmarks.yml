name: BloomFilter Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        type: choice
        options:
          - jmh
          - gatling
          - both
        default: jmh

      target_base_url:
        description: Base URL of the deployed service for Gatling
        required: false
        type: string
        default: ""

      penetration_rps:
        description: Cache penetration requests per second
        required: true
        type: string
        default: "500"

      legitimate_rps:
        description: Legitimate requests per second
        required: true
        type: string
        default: "200"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run ${{ inputs.suite }} benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          validate-wrappers: false

      - name: Validate Gatling inputs
        if: ${{ inputs.suite == 'gatling' || inputs.suite == 'both' }}
        env:
          TARGET_BASE_URL: ${{ inputs.target_base_url }}
          PENETRATION_RPS: ${{ inputs.penetration_rps }}
          LEGITIMATE_RPS: ${{ inputs.legitimate_rps }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_BASE_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::Provide a reachable HTTP or HTTPS target_base_url."
            exit 1
          fi

          if [[ ! "$PENETRATION_RPS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::penetration_rps must be a positive integer."
            exit 1
          fi

          if [[ ! "$LEGITIMATE_RPS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::legitimate_rps must be a positive integer."
            exit 1
          fi

      - name: Run JMH microbenchmarks
        if: ${{ inputs.suite == 'jmh' || inputs.suite == 'both' }}
        run: |
          gradle :bloomfilter-benchmarks:jmh \
            --no-daemon \
            --rerun-tasks

      - name: Run Gatling load simulation
        if: ${{ inputs.suite == 'gatling' || inputs.suite == 'both' }}
        env:
          TARGET_BASE_URL: ${{ inputs.target_base_url }}
          PENETRATION_RPS: ${{ inputs.penetration_rps }}
          LEGITIMATE_RPS: ${{ inputs.legitimate_rps }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :bloomfilter-benchmarks:gatlingRun \
            --no-daemon \
            "-PtargetBaseUrl=${TARGET_BASE_URL}" \
            "-PpenetrationRps=${PENETRATION_RPS}" \
            "-PlegitimateRps=${LEGITIMATE_RPS}"
