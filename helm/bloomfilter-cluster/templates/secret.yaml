apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bloomfilter.fullname" . }}-tls-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "bloomfilter.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_TRUSTSTORE_PASSWORD: {{ .Values.redis.truststorePassword | quote }}
