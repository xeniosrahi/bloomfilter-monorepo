global:
  namespace: staging-environment
  slaTier: "99.99"

replicaCount: 3

image:
  repository: codingdevs/bloomfilter-sync-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8080

bloom:
  initialCapacity: 100000
  targetErrorRate: 0.01
  streamKey: "bloom-stream"
  filterKey: "global_bloom_l2"
  consumerGroup: "bloom-cluster-group"
  streamMaxEntries: 50000

redis:
  enabled: true
  image: redis/redis-stack-server:latest
  port: 6379
  sslEnabled: true
  truststorePassword: "securepassword123"
  storageSize: "20Gi"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: "nginx"
  host: "bloom.codingdevs.com"
