apiVersion: v1
kind: Service
metadata:
  name: {{ include "bloomfilter.fullname" . }}-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: bloom-sync-service
    {{- include "bloomfilter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app: bloom-sync-service
