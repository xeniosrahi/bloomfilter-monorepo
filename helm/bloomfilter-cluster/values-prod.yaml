global:
  namespace: bloom-production
  slaTier: "99.99"

replicaCount: 5

bloom:
  initialCapacity: 10000000
  targetErrorRate: 0.005
  streamMaxEntries: 250000

redis:
  sslEnabled: true
  storageSize: "50Gi"
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 4
