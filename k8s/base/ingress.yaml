apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bloom-sync-ingress
  namespace: staging-environment
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: bloom.codingdevs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bloom-sync-service
                port:
                  number: 8080
