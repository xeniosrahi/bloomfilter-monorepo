name: BloomFilter Monorepo CI/CD & Chaos Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Maven Build & Unit Tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Execute Unit Tests
        run: mvn clean verify -B

      - name: Generate mTLS Certificates & PKCS12 Truststore
        run: ./scripts/generate-tls-certs.sh

  docker-and-chaos-validation:
    name: Container Build & Chaos Mesh Manifest Validation
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Generate mTLS Certificates
        run: ./scripts/generate-tls-certs.sh

      - name: Build Production Docker Image
        run: docker build -t codingdevs/bloomfilter-sync-service:1.0.0 .

      - name: Validate Kubernetes Kustomize Overlay
        run: kubectl kustomize k8s/base > /tmp/rendered-k8s.yaml
