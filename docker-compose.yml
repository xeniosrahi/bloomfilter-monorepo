version: '3.8'

services:
  redis-bloom:
    image: redis/redis-stack-server:latest
    container_name: redis_bloom_node
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bloom-sync-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloom_sync_node_1
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis-bloom
      - REDIS_PORT=6379
      - REDIS_SSL_ENABLED=false
      - BLOOM_INITIAL_CAPACITY=100000
      - BLOOM_TARGET_ERROR_RATE=0.01
    depends_on:
      redis-bloom:
        condition: service_healthy
    restart: always

  bloom-sync-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloom_sync_node_2
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis-bloom
      - REDIS_PORT=6379
      - REDIS_SSL_ENABLED=false
      - BLOOM_INITIAL_CAPACITY=100000
      - BLOOM_TARGET_ERROR_RATE=0.01
    depends_on:
      redis-bloom:
        condition: service_healthy
    restart: always

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: bloom_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - bloom-sync-node-1
      - bloom-sync-node-2
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    container_name: bloom_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always

volumes:
  redis_data:
