
name: BloomFilter Monorepo CI/CD & Chaos Validation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Gradle Build & Unit Tests (Java 21)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle & Cache Dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x ./gradlew

      - name: Build & Execute Unit Tests
        run: ./gradlew clean build --no-daemon

      - name: Generate mTLS Certificates & PKCS12 Truststore
        run: |
          chmod +x ./scripts/generate-tls-certs.sh
          ./scripts/generate-tls-certs.sh

  docker-and-chaos-validation:
    name: Container Build & Chaos Mesh Manifest Validation
    needs: build-and-test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle & Cache Dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Generate mTLS Certificates
        run: |
          chmod +x ./scripts/generate-tls-certs.sh
          ./scripts/generate-tls-certs.sh

      - name: Build Production Docker Image
        run: docker build -t codingdevs/bloomfilter-sync-service:1.0.0 .

      - name: Validate Kubernetes Kustomize Overlay
        run: |
          kubectl kustomize k8s/base > /tmp/rendered-k8s.yaml
          test -s /tmp/rendered-k8s.yaml
          echo "Kustomize manifest rendered successfully."
